<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- No zooming: on a touchscreen kiosk a pinch is always an accident, and there is nobody there
     to pinch it back. Phone browsers honour this; desktop ones on a touchscreen need the
     touch-action in css/app.css and the listeners in js/main.js as well. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Share Your Sky</title>
  <script type="module" crossorigin src="./assets/main-CknbsQ65.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="./assets/store-BlYq4WLC.js">
  <link rel="stylesheet" crossorigin href="./assets/app-CO2Mlun7.css">
</head>
<body data-step="camera">

<!-- Applied before the module loads, not from boot(): on hardware where the heavy effects are
     the problem, one painted frame of them is one too many. -->
<script>
  var fx = new URLSearchParams(location.search).get('fx')
  if (fx === 'lite' || fx === 'off') document.body.dataset.fx = fx
</script>

<div class="sky" aria-hidden="true"></div>

<!-- ═══════════ Four steps, one per screen ═══════════
     Each is a self-contained section that owns its own content. Only one is ever on screen,
     chosen by body[data-step]. `?step=edit` jumps straight to one while working on it. -->

<!-- ═══════════ Where the visitor is ═══════════
     Across the top, so it reads as a heading rather than as something to press. The one thing
     to press is the button at the foot, on its own. -->
<header class="topbar">
  <!-- The blob lives outside the list because an <ol> may only contain <li>, and it has to
       share a positioning context with the marks it travels between. -->
  <div class="steps-bar" id="stepsBar">
    <i class="dot-blob" id="stepBlob" aria-hidden="true"></i>
    <ol class="dots" id="stepBar" aria-label="Progress">
      <li class="dot" data-step="camera">
        <span class="dot-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.2-2h6.2l1.2 2h1.7A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.4"/></svg></span>
        <span class="dot-label"><b class="dot-no">1.</b> Photo</span>
      </li>
      <li class="dot" data-step="edit">
        <span class="dot-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.3"/><circle cx="15.5" cy="12" r="2.3"/><circle cx="7.5" cy="17" r="2.3"/></svg></span>
        <span class="dot-label"><b class="dot-no">2.</b> Adjust</span>
      </li>
      <li class="dot" data-step="share">
        <span class="dot-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M12 4 8 8M12 4l4 4"/><path d="M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg></span>
        <span class="dot-label"><b class="dot-no">3.</b> Share</span>
      </li>
      <li class="dot" data-step="reality">
        <span class="dot-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7 20v-6M12 20V6M17 20v-9"/></svg></span>
        <span class="dot-label"><b class="dot-no">4.</b> Reality</span>
      </li>
    </ol>
  </div>
</header>

<main class="steps">

  <!-- 1 ─ CAMERA ─────────────────────────────────────────────────────────── -->
  <section class="step" data-step="camera">
    <h1 class="title">Share Your Sky</h1>
    <div class="live-frame">
      <!-- The crop lives on a wrapper rather than on the video, so it composes with the
           rotation transforms instead of having to be folded into each of them. The wrapper is
           exactly the frame's box, so everything the rotation rules measure is unchanged. -->
      <div class="crop" id="liveCrop">
        <video id="feed" class="framed" playsinline muted autoplay></video>
      </div>
      <!-- Stands in for the camera when there is not one. Outside the crop wrapper on purpose:
           the crop and the rotation correct for how a camera is bolted to a bracket, and a
           picture off the wall was never on that bracket. -->
      <img class="stand-in" id="standIn" alt="" hidden>
      <div class="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="countdown" id="countdown" aria-live="polite"></div>
    </div>
    <p class="hint">Frame your photo. When you’re ready, press the button below to start a 5 second countdown.</p>
    <p class="err" id="camError" hidden></p>
  </section>

  <!-- 2 ─ WHAT THE CAMERA DID ─────────────────────────────────────────────── -->
  <!-- The photo and two paragraphs on the left, the three channels it is made of down the
       right. Nothing to touch — the adjusting happens on the next screen. The photo arrives
       black and is built up a colour at a time as each colour's name lights and its own layer
       appears beside it. Nothing is authored in place; see js/main.js. -->
  <section class="step" data-step="edit">
    <div class="split split-parts">
      <div class="split-left">
        <div class="pic pic-col" id="photoStack">
          <canvas id="photoA" class="photo"></canvas>
          <canvas id="photoB" class="photo"></canvas>
        </div>
        <p class="story" id="story"></p>
      </div>

      <!-- The same light, taken apart. Each one arrives at the moment its name lights in the
           sentence and its colour appears in the picture on the left, so the composite and its
           three parts are visibly the same thing. -->
      <div class="chan-layers" id="chanLayers" aria-hidden="true">
        <figure class="chan-layer" data-ch="0"><canvas class="chan-img"></canvas></figure>
        <figure class="chan-layer" data-ch="1"><canvas class="chan-img"></canvas></figure>
        <figure class="chan-layer" data-ch="2"><canvas class="chan-img"></canvas></figure>
      </div>

      <!-- The summary, across the foot of the screen and centred on it, under both columns:
           it is about the picture and its three parts together. -->
      <p class="story" id="storyAfter"></p>
    </div>

    <!-- The copies that fly from a layer into the frame. Over the whole step rather than inside
         either column, because they travel between the two. -->
    <div class="fliers" id="fliers" aria-hidden="true"></div>
  </section>

  <!-- 3 ─ ADJUST ─────────────────────────────────────────────────────────── -->
  <!-- Two phases in one layout, switched by data-phase:

         ask    one column, the picture large and alone, the question underneath it
         tune   the same split as steps 2 and 4, with the three charts back on the right

       The charts are the same controls over the same numbers, but with the colour each
       channel's light is *shown* as now loose. Nothing is offered until they have moved one. -->
  <section class="step" data-step="adjust">
    <!-- A field of stars round the picture, built by js/main.js. Each has a temperature, and so
         a colour, and the filter in the wheel's gate decides which of them come through — the
         same sky, a different population of it at every filter. -->
    <div class="starfield" id="starfield" aria-hidden="true"></div>
    <div class="split" id="adjustSplit" data-phase="ask">
      <!-- Across both columns in the second phase, over the picture and the charts alike. The
           word "colors" carries the rainbow that sweeps through it. -->
      <h2 class="channels-title" id="slidersTitle">Try changing the <span class="rainbow">colors</span></h2>
      <div class="split-left">
        <h2 class="pic-title">Your final image</h2>
        <div class="pic pic-col" id="adjustPic">
          <canvas id="adjustCanvas" class="photo"></canvas>
          <!-- The filter wheel, inside the picture so the picture's own edges crop it: the
               filters are wider than the screen and what shows of one is the arc that reaches
               into the right-hand quarter. The arrows are the invitation; the swipe that
               answers them is listened for on the whole screen, in js/main.js, which also
               builds the filters. -->
          <div class="filter-wheel" id="filterWheel" aria-hidden="true">
            <i class="wheel-hint">
              <i class="wheel-arrow up"></i>
              <i class="wheel-arrow down"></i>
            </i>
          </div>
        </div>
        <p class="story" id="adjustStory"></p>
        <!-- Arrives with the visitor's first change, whatever they changed. -->
        <p class="notice-ask" id="noticeAsk"></p>
      </div>
      <div class="channels" id="adjustChannels">
        <div class="channel" data-ch="0"><div class="channel-editor"></div></div>
        <div class="channel" data-ch="1"><div class="channel-editor"></div></div>
        <div class="channel" data-ch="2"><div class="channel-editor"></div></div>
      </div>
    </div>
  </section>

  <!-- 4 ─ REAL? AND SHARE? ──────────────────────────────────────────────────── -->
  <!-- The photograph as the camera made it and as the visitor left it, side by side, each with
       "Is this image real?" underneath — the question asked of the pair, where the difference
       between them is on screen. Once both have been answered, the share question: share the
       edited one, the original, or neither. Neither starts the whole thing again; nothing is
       kept.

       Each figure is dragged between No and Yes and where it is left is the answer. It starts
       in the middle, undecided, and js/main.js reports it to api/answer when the visitor leaves
       this screen — but only if they moved it. The scales are built from the template at the
       foot of this file. -->
  <!-- A strip of the wall itself, so the question is asked with the thing it is about already
       on screen. Decorative until a picture is shared, when a space opens in it and the
       visitor's picture turns into it. -->
  <section class="step" data-step="confirm">
    <div class="reel" id="reelTop" aria-hidden="true"><div class="reel-track"></div></div>
    <div class="confirm-mid">
      <div class="confirm-pair">
        <div class="confirm-col" id="originalCol">
          <h2 class="pic-title">Original</h2>
          <div class="pic pic-hero" id="originalPic">
            <canvas id="originalCanvas" class="photo"></canvas>
          </div>
          <div class="verdict" id="editVerdict">
            <p class="real-ask"></p>
          </div>
        </div>
        <div class="confirm-col" id="editedCol">
          <h2 class="pic-title">Edited</h2>
          <div class="pic pic-hero" id="confirmPic">
            <canvas id="confirmCanvas" class="photo"></canvas>
          </div>
          <div class="verdict" id="verdict">
            <p class="real-ask"></p>
          </div>
        </div>
      </div>
      <p class="story story-ask" id="confirmAsk"></p>
    </div>
  </section>

  <!-- 4 ─ REALITY ──────────────────────────────────────────────────────── -->
  <!-- The last screen is not about the visitor's picture at all. It is about the room: everyone
       who stands here is asked the same question twice, and the two answers are rarely the
       same. Both charts are drawn by js/main.js from api/answer/summary. -->
  <section class="step" data-step="reality">
    <p class="story story-wide" id="realityLead"></p>

    <div class="reality" id="realityCharts" hidden>
      <figure class="answer-chart" data-stage="unedited">
        <figcaption>
          <b>The photo the camera made</b>
          <span class="answer-count"></span>
        </figcaption>
        <!-- Bars over a well, the scale under it: a levels chart, counting people instead of
             pixels. The marker is where this visitor put their own figure. -->
        <div class="answer-plot">
          <canvas></canvas>
          <i class="answer-you" hidden><b>you</b></i>
        </div>
        <div class="answer-base"></div>
        <div class="scale-ends"><span>No</span><span>Yes</span></div>
      </figure>

      <figure class="answer-chart" data-stage="edited">
        <figcaption>
          <b>After the colors were changed</b>
          <span class="answer-count"></span>
        </figcaption>
        <div class="answer-plot">
          <canvas></canvas>
          <i class="answer-you" hidden><b>you</b></i>
        </div>
        <div class="answer-base"></div>
        <div class="scale-ends"><span>No</span><span>Yes</span></div>
      </figure>

      <!-- Which of the two pictures people chose to put on the wall. Two bars, drawn by
           js/main.js from the same summary. -->
      <figure class="answer-chart share-chart" data-stage="shared">
        <figcaption>
          <b>Which picture people shared</b>
          <span class="answer-count"></span>
        </figcaption>
        <div class="share-bars">
          <div class="share-bar" data-pick="edited">
            <div class="share-well"><i class="share-fill"></i></div>
            <span class="share-label">Edited <span class="share-n"></span> <em class="share-you" hidden>you</em></span>
          </div>
          <div class="share-bar" data-pick="original">
            <div class="share-well"><i class="share-fill"></i></div>
            <span class="share-label">Original <span class="share-n"></span> <em class="share-you" hidden>you</em></span>
          </div>
        </div>
      </figure>
    </div>
  </section>

</main>

<!-- The scale, written once and cloned into each question by js/main.js. Two copies of this in
     the page is two copies that drift apart. -->
<template id="scaleTpl">
  <div class="scale" tabindex="0" role="slider" aria-label="Is this image real?"
       aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.5">
    <div class="scale-track">
      <!-- Somebody walking the scale. Two poses, both in the page from the start so the first
           step never waits on an image, and only one of them visible at a time. They are used
           as masks rather than drawn, so the figure is filled with the colour of the bar under
           its feet exactly as the drawn one was. -->
      <span class="scale-figure" aria-hidden="true">
        <i class="walker walk-stride"></i>
        <i class="walker walk-pass"></i>
      </span>
    </div>
    <div class="scale-ends"><span>No</span><span>Yes</span></div>
  </div>
</template>

<!-- ═══════════ The dock ═══════════
     Always on screen at the foot: the one action this step offers, and where the visitor is in
     the sequence. Nothing else competes for the bottom of a very tall screen. -->
<!-- ═══════════ The dock ═══════════
     The one action this step offers, at the foot and within reach. Nothing else competes for
     the bottom of a very tall screen. -->
<footer class="dock">
  <div class="dock-action">
    <button id="shutter" class="shutter" aria-label="Take a photo" disabled>
      <span class="shutter-dot"></span>
    </button>
    <button id="nextBtn" class="btn btn-lg">Next</button>
    <span class="dock-swap">
      <button id="coloursBtn" class="btn btn-lg">Next</button>
      <button id="submitBtn" class="btn btn-lg">Share my sky</button>
    </span>
    <button id="noBtn" class="btn ghost btn-lg">Don’t share</button>
    <button id="yesBtn" class="btn btn-lg">Share Edited</button>
    <button id="originalBtn" class="btn btn-lg">Share Original</button>
    <button id="resetBtn" class="btn ghost">Start again</button>
  </div>

  <!-- Offered after a minute with nobody touching anything, on every step but the camera: off to
       the right, out of the way of the step's own button, and counting down to a fresh start if
       it is still not touched. js/main.js runs it. -->
  <div class="idle" id="idle" hidden>
    <span class="idle-count" id="idleCount" aria-live="polite"></span>
    <button id="idleBtn" class="btn idle-btn">Start over</button>
  </div>

</footer>

<div class="flash" id="flash" aria-hidden="true"></div>

</body>
</html>
