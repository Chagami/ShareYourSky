<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share Your Sky — Gallery Wall</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/gallery.css">
</head>
<body class="wall">

<div class="sky" aria-hidden="true"></div>

<header class="wall-head">
  <h1>Every one of these is the same light, shown differently.</h1>
  <p>Each visitor chose how much of the red, green and blue their camera captured would show.</p>
</header>

<p class="wall-empty" id="empty">No skies shared yet.</p>

<div class="wall-grid" id="grid"></div>

<script type="module" src="js/gallery.js"></script>
</body>
</html>
